  hand-drawn vector wordmark: no external fonts, every glyph built from
  stroked geometric paths with rounded ink caps. "Daoism" in deep ink,
  "Hub" in jade echoing the mountain. The open-enso gap, mountain stillness
  and cinnabar seal share the same three-color ink-painting palette.
-->
